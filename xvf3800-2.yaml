substitutions:
  name: xvf3800-2
  friendly_name: ReSpeaker XVF3800 2
  # Wake only after the speech-to-text check, with the word actually said.
  wake_verify_mode: reroute

packages:
  common: !include xvf3800/common.yaml

micro_wake_word:
  models:
    # Published in wsieber/microwakewords (cd5d2ca), all at cutoff 0.98 and window 7: the manifests'
    # looser cutoffs false-woke on TV. Wake Word Studio 2026-10-26 (custom negatives plus football).
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/frederickesp32.json
      id: frederick
    # Wake Word Studio 2026-10-26.
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/alfredesp32.json
      id: alfred
    # Wake Word Studio 2026-10-27 (custom negatives plus GC); replaces plain Batman.
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/okay_batmanesp32.json
      id: okay_batman

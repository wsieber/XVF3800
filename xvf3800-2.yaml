substitutions:
  name: xvf3800-2
  friendly_name: ReSpeaker XVF3800 2

packages:
  common: !include xvf3800/common.yaml

micro_wake_word:
  # Lower VAD gate, same as respeaker-xvf3800.yaml (.121): at 0.5 it blocked a wake word the model
  # scored 0.99+. Overrides common.yaml's 0.5 for this unit.
  vad:
    probability_cutoff: 0.3
  models:
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/frederickv2esp32.json
      id: frederick
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/ok_emily.json
      id: ok_emily
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/okay_computeresp32.json
      id: okay_computer
      # Manifest says 0.95; real detections averaged 0.94-0.96, so 0.92 gives some margin.
      probability_cutoff: 0.92
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/yo_fredricesp32.json
      id: yo_fredric
      # Manifest says 0.95; on .121 real detections averaged 0.92-0.97, 9 for 9.
      probability_cutoff: 0.92

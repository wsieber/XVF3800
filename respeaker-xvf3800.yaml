substitutions:
  name: respeaker-xvf3800
  friendly_name: ReSpeaker XVF3800

packages:
  common: !include xvf3800/common.yaml

micro_wake_word:
  # Test set from Wake Word Studio (2026-10-15/16).
  models:
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/okay_computeresp32.json
      id: okay_computer
      # Manifest says 0.95; real detections averaged 0.95-0.96, so 0.92 gives some margin.
      probability_cutoff: 0.92
    # Baseline for a Frederick v3 trained at 75k/50k: v2 was 50k/40k. Load one Frederick at a time.
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/frederickv2esp32.json
      id: frederick
      # Raised to 0.96 on 2026-10-20: 0.92 gave too many false wakes.
      probability_cutoff: 0.96
      # Window raised from the manifest's 5 on 2026-10-20 to cut false wakes: the score has to stay
      # high across more frames.
      sliding_window_size: 8
    # Test word from Wake Word Studio (2026-10-22, 75k/50k), replacing Yo Fredric. Manifest's
    # calibrated cutoff 0.95 and window 5 for now.
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/yo_frederickesp32.json
      id: yo_frederick

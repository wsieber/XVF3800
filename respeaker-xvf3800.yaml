substitutions:
  name: respeaker-xvf3800
  friendly_name: ReSpeaker XVF3800
  # Trial: wake only after the speech-to-text check, with the word actually said.
  wake_verify_mode: reroute

packages:
  common: !include xvf3800/common.yaml

micro_wake_word:
  models:
    # Published in wsieber/microwakewords (cd5d2ca), all at cutoff 0.98 and window 7: the manifests'
    # looser cutoffs false-woke on TV. Wake Word Studio 2026-10-26 (custom negatives plus football).
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/frederickesp32.json
      id: frederick
      # 0.92 rather than the published 0.98, which missed real calls (0.96 still missed over half):
      # the speech-to-text check drops the extra false fires.
      probability_cutoff: 0.92
    # Wake Word Studio 2026-10-26.
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/alfredesp32.json
      id: alfred
      probability_cutoff: 0.96
    # Back in place of Okay Batman, now that the speech-to-text check drops its false fires: the
    # 2026-10-26 trial (custom negatives), a local copy; the published computer.json is the older
    # 10-24 run.
    - model: .esphome/test_models/computer_20261026/computer.json
      id: computer
      probability_cutoff: 0.92

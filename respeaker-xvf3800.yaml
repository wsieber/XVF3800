substitutions:
  name: respeaker-xvf3800
  friendly_name: ReSpeaker XVF3800

packages:
  common: !include xvf3800/common.yaml

micro_wake_word:
  # Test set from Wake Word Studio (2026-10-15/16).
  models:
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/okay_computeresp32.json
      id: okay_computer
      # Manifest says 0.95; real detections averaged 0.95-0.96, so 0.92 gives some margin.
      probability_cutoff: 0.92
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/yo_fredricesp32.json
      id: yo_fredric
      # Manifest says 0.95; starting at 0.92 like Okay Computer.
      probability_cutoff: 0.92
    # Baseline for a Frederick v3 trained at 75k/50k: v2 was 50k/40k. Load one Frederick at a time.
    - model: https://raw.githubusercontent.com/wsieber/microwakewords/main/frederickv2esp32.json
      id: frederick
      # Manifest says 0.96; 0.92 to match the other test words.
      probability_cutoff: 0.92
